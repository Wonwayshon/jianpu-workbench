name: Check and build desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'platform/**', 'desktop/**', 'scripts/**', 'tests/**', 'project.json', 'package*.json', '.github/workflows/**']
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run security:check
      - run: npm test
  desktop:
    needs: core
    strategy:
      matrix:
        include:
          - os: macos-latest
            bundle: app
            artifact: outputs/flute-key-lab-macos-*
          - os: windows-latest
            bundle: nsis
            artifact: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: rustup update stable
      - run: npm run check:desktop
      - run: npm run build:desktop -- --bundles ${{ matrix.bundle }}
      - name: Package verified Mac DMG
        if: runner.os == 'macOS'
        run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact }}
